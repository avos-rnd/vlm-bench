<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title description">
  <title id="title">Auditing VLM benchmarks from existing evaluation runs</title>
  <desc id="description">Saved full-run outputs and an extra text-only rerun feed six audit detectors, producing per-question review candidates. On MMStar, 20.2 percent of items have zero pool-averaged visual gain against a 17.0 percent permutation baseline, an excess of 3.2 percentage points. 134 unanimous non-gold answer conflicts remain candidates for human review. Binary yes/no formats are out of calibration.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#8f9db3" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="710" rx="24" fill="#f4f6fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#15243d">
    <text x="40" y="49" font-size="15" font-weight="700" letter-spacing="2.4" fill="#365ebc">VLM-BENCH · BENCHMARK AUDITING</text>
    <text x="40" y="99" font-size="35" font-weight="700">From evaluation runs to benchmark diagnostics</text>
    <text x="40" y="137" font-size="21" fill="#53647e">Reuse saved predictions to find questions that deserve a closer look.</text>

    <rect x="40" y="174" width="340" height="270" rx="18" fill="#fff" stroke="#d9e1ef"/>
    <rect x="430" y="174" width="340" height="270" rx="18" fill="#fff" stroke="#d9e1ef"/>
    <rect x="820" y="174" width="340" height="270" rx="18" fill="#fff" stroke="#d9e1ef"/>
    <path d="M390 310H418" stroke="#8f9db3" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M780 310H808" stroke="#8f9db3" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#365ebc"><circle cx="74" cy="212" r="16"/><circle cx="464" cy="212" r="16"/><circle cx="854" cy="212" r="16"/></g>
    <g fill="#fff" text-anchor="middle" font-size="17" font-weight="700"><text x="74" y="218">1</text><text x="464" y="218">2</text><text x="854" y="218">3</text></g>
    <g font-size="23" font-weight="700"><text x="102" y="220">Saved outputs</text><text x="492" y="220">Six detectors</text><text x="882" y="220">Audit report</text></g>

    <rect x="62" y="249" width="296" height="72" rx="10" fill="#eef2ff"/>
    <path d="M82 302V274M96 302V262M110 302V283" stroke="#5876ce" stroke-width="9"/>
    <text x="134" y="279" font-size="20" font-weight="700">Full model runs</text>
    <text x="134" y="304" font-size="17" fill="#53647e">Predictions + judged hits</text>
    <rect x="62" y="334" width="296" height="72" rx="10" fill="#eaf6f2"/>
    <rect x="80" y="351" width="36" height="32" rx="4" fill="none" stroke="#238676" stroke-width="2"/>
    <path d="M82 381L95 366L104 377L114 363M79 385L118 348" stroke="#238676" stroke-width="2.5" fill="none"/>
    <text x="134" y="364" font-size="20" font-weight="700">One blind rerun</text>
    <text x="134" y="389" font-size="17" fill="#53647e">Visual inputs removed</text>
    <text x="64" y="427" font-size="17" fill="#53647e">Align by dataset question ID</text>

    <g font-size="19">
      <g fill="#238676"><circle cx="456" cy="264" r="4"/><circle cx="456" cy="294" r="4"/><circle cx="456" cy="324" r="4"/><circle cx="456" cy="354" r="4"/><circle cx="456" cy="384" r="4"/><circle cx="456" cy="414" r="4"/></g>
      <text x="472" y="270">Visual dependency</text>
      <text x="472" y="300">Non-gold consensus</text>
      <text x="472" y="330">Answer agreement</text>
      <text x="472" y="360">Correctness agreement</text>
      <text x="472" y="390">Option-position imbalance</text>
      <text x="472" y="420">Distractor similarity</text>
    </g>

    <path d="M847 259H1129M847 280H1129M847 311H1129M847 342H1129" stroke="#e1e7f0" stroke-width="1.5"/>
    <g font-size="16" fill="#6a7a91"><text x="852" y="274">Question</text><text x="942" y="274">Finding</text><text x="1061" y="274">Severity</text></g>
    <g fill="#365ebc"><rect x="852" y="293" width="42" height="6" rx="3"/><rect x="852" y="324" width="42" height="6" rx="3"/></g>
    <g fill="#ccd5e5"><rect x="942" y="293" width="83" height="6" rx="3"/><rect x="942" y="324" width="61" height="6" rx="3"/></g>
    <circle cx="1086" cy="296" r="5" fill="#ce7754"/><circle cx="1086" cy="327" r="5" fill="#d9aa4f"/>
    <text x="844" y="373" font-size="20" font-weight="700">Per-question review candidates</text>
    <text x="844" y="402" font-size="18" fill="#53647e">Statistics + uncertainty</text>
    <text x="844" y="429" font-size="18" fill="#53647e">Full / blind provenance</text>

    <rect x="40" y="477" width="340" height="168" rx="18" fill="#e4edf9"/>
    <rect x="430" y="477" width="340" height="168" rx="18" fill="#e3f1ed"/>
    <rect x="820" y="477" width="340" height="168" rx="18" fill="#fff" stroke="#d9e1ef"/>
    <text x="62" y="531" font-size="43" font-weight="700" fill="#365ebc">+3.2 pp</text>
    <text x="62" y="565" font-size="20" font-weight="700">Excess zero visual gain</text>
    <text x="62" y="596" font-size="17" fill="#53647e">20.2% observed · 17.0% null</text>
    <text x="62" y="622" font-size="17" fill="#53647e">Corrected permutation p = 0.001</text>
    <text x="452" y="531" font-size="43" font-weight="700" fill="#238676">134</text>
    <text x="452" y="565" font-size="20" font-weight="700">Unanimous label conflicts</text>
    <text x="452" y="596" font-size="17" fill="#53647e">Candidates; human review pending</text>
    <text x="452" y="622" font-size="17" fill="#53647e">117 three-vote · 17 two-vote</text>
    <text x="842" y="531" font-size="34" font-weight="700">MMStar</text>
    <text x="842" y="565" font-size="20" font-weight="700">1,500 MCQ items · 3 models</text>
    <text x="842" y="596" font-size="17" fill="#53647e">Zero gain includes all-wrong items.</text>
    <text x="842" y="622" font-size="17" fill="#53647e">Binary yes/no: out of calibration.</text>
    <text x="40" y="684" font-size="17" fill="#53647e">arXiv:2610.13548 · TAE @ NeurIPS 2026 · Findings are screening signals for human review.</text>
  </g>
</svg>
