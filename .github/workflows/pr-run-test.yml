name: Audit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/audit.txt
      - name: Install CPU-only audit dependencies
        run: python -m pip install -r requirements/audit.txt
      - name: Test detectors, exports, and aggregation
        run: python -m pytest tests/test_detectors.py tests/test_bench_eval_pipeline.py tests/test_audit_reporting.py tests/test_paper_reproduction.py -q
      - name: Reproduce both paper benchmarks and statistical figures
        run: >-
          python scripts/reproduce_paper.py --input-dir paper-inputs
          --out outputs/paper-reproduction --figures
