name: Audit lint

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: audit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install flake8==7.1.2
      - name: Check audit code for syntax and undefined names
        run: >-
          python -m flake8 vlmeval/detector vlmeval/reporting vlmeval/bench_eval.py
          tests/test_detectors.py tests/test_bench_eval_pipeline.py tests/test_audit_reporting.py tests/test_paper_reproduction.py
          scripts/reproduce_paper.py --select=E9,F63,F7,F82
      - name: Check whitespace and conflict markers
        run: git show --format= --check HEAD
